<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; script-src * data: blob: 'unsafe-inline' 'unsafe-eval'; style-src * data: blob: 'unsafe-inline'; img-src * data: blob:; font-src * data: blob:; connect-src * data: blob:; media-src * data: blob:; worker-src * data: blob:; frame-src * data: blob:; object-src 'none'; form-action 'none'; base-uri 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Management Console</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8fafc; font-family: sans-serif; }
        .drawer-enter { transform: translateX(100%); transition: transform 0.3s ease; }
        .drawer-open { transform: translateX(0); }
        .status-pill { padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useMemo } = React;

        const MOCK_DATA = Array.from({ length: 25 }).map((_, i) => ({
            id: `key-${i}`,
            name: ['Production-Read', 'Staging-Write', 'CI-Deploy', 'Analytics-Sync', 'Internal-Tool'][i % 5],
            owner: ['Alice', 'Bob', 'Charlie', 'Dave', 'Eve'][i % 5],
            scopes: ['read', 'write', 'admin', 'audit'][i % 4],
            lastUsed: i % 3 === 0 ? '2 hours ago' : i % 3 === 1 ? '14 days ago' : 'Never',
            created: '2023-10-01',
            expires: i % 4 === 0 ? '2023-12-01' : '2024-05-20',
            status: ['healthy', 'stale', 'expiring', 'leaked-suspected', 'revoked'][i % 5]
        }));

        const StatusPill = ({ status }) => {
            const colors = {
                healthy: 'bg-green-100 text-green-700',
                stale: 'bg-gray-100 text-gray-700',
                expiring: 'bg-yellow-100 text-yellow-700',
                'leaked-suspected': 'bg-red-100 text-red-700',
                revoked: 'bg-slate-200 text-slate-600'
            };
            return <span className={`status-pill ${colors[status]}`}>{status.toUpperCase()}</span>;
        };

        function App() {
            const [filter, setFilter] = useState('all');
            const [selected, setSelected] = useState([]);
            const [drawer, setDrawer] = useState(null);

            const filteredData = useMemo(() => {
                if (filter === 'all') return MOCK_DATA;
                return MOCK_DATA.filter(d => d.status === filter || (filter === 'over-scoped' && d.scopes === 'admin'));
            }, [filter]);

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="mb-8">
                        <h1 className="text-2xl font-bold text-slate-900">API Key Management</h1>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                            {[{l: 'Total Keys', v: 25}, {l: 'Active', v: 18}, {l: 'Over-scoped', v: 6}, {l: 'Expiring Soon', v: 3}].map(s => (
                                <div key={s.l} className="bg-white p-4 rounded border border-slate-200 shadow-sm">
                                    <div className="text-xs text-slate-500 uppercase">{s.l}</div>
                                    <div className="text-2xl font-bold">{s.v}</div>
                                </div>
                            ))}
                        </div>
                    </header>

                    <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
                        <div className="p-4 border-b border-slate-200 flex flex-wrap gap-2 items-center justify-between">
                            <input className="border rounded px-3 py-1.5 text-sm w-full md:w-64" placeholder="Search keys..." />
                            <div className="flex gap-1">
                                {['all', 'active', 'stale', 'expiring', 'over-scoped'].map(f => (
                                    <button key={f} onClick={() => setFilter(f)} className={`px-3 py-1 text-xs font-medium rounded ${filter === f ? 'bg-blue-600 text-white' : 'bg-slate-100'}`}>
                                        {f.charAt(0).toUpperCase() + f.slice(1)}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-600 uppercase text-xs">
                                    <tr>
                                        <th className="p-3"><input type="checkbox" /></th>
                                        {['Name', 'Owner', 'Scopes', 'Last Used', 'Expires', 'Status'].map(h => <th key={h} className="p-3">{h}</th>)}
                                        <th className="p-3">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredData.map(row => (
                                        <tr key={row.id} className="border-t border-slate-100 hover:bg-slate-50 cursor-pointer" onClick={() => setDrawer(row)}>
                                            <td className="p-3"><input type="checkbox" onClick={(e) => e.stopPropagation()} /></td>
                                            <td className="p-3 font-medium">{row.name}</td>
                                            <td className="p-3">{row.owner}</td>
                                            <td className="p-3">{row.scopes}</td>
                                            <td className="p-3">{row.lastUsed}</td>
                                            <td className="p-3">{row.expires}</td>
                                            <td className="p-3"><StatusPill status={row.status} /></td>
                                            <td className="p-3 text-slate-400">•••</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {drawer && (
                        <div className="fixed inset-0 bg-black/20 z-50" onClick={() => setDrawer(null)}>
                            <div className="absolute right-0 top-0 h-full w-full md:w-96 bg-white shadow-xl p-6 overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <h2 className="text-xl font-bold mb-4">Audit Log: {drawer.name}</h2>
                                <div className="space-y-4 text-sm">
                                    <p><strong>Owner:</strong> {drawer.owner}</p>
                                    <p><strong>Created:</strong> {drawer.created}</p>
                                    <div className="border-t pt-4">
                                        <h3 className="font-semibold mb-2">Recent Events</h3>
                                        <ul className="space-y-2 text-slate-600">
                                            <li>• Key rotated 12 days ago</li>
                                            <li>• Access granted to S3 bucket</li>
                                            <li>• Last login from 192.168.1.1</li>
                                        </ul>
                                    </div>
                                    <button onClick={() => setDrawer(null)} className="mt-8 w-full bg-slate-900 text-white py-2 rounded">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
